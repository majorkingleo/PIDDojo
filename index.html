<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PID Dojo — Phase 1</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">◎</span>
          <div>
            <h1>PID Dojo</h1>
            <p>Phase 1 · proportional control</p>
          </div>
        </div>

        <div class="topbar-group">
          <label for="task-select">Task</label>
          <select id="task-select"></select>
          <label for="worksheet-select">Worksheet</label>
          <select id="worksheet-select">
            <option value="">— current —</option>
          </select>
          <input
            id="worksheet-name"
            type="text"
            maxlength="60"
            placeholder="Untitled worksheet"
            title="Name this worksheet"
            aria-label="Worksheet name"
          />
          <label for="lang-select">Lang</label>
          <select id="lang-select" title="Language of the help pages"></select>
        </div>

        <div class="topbar-group">
          <button id="btn-new-variant" class="btn">New variant</button>
          <button id="btn-save" class="btn">Save</button>
          <button id="btn-export" class="btn">Export</button>
          <button id="btn-import" class="btn">Import</button>
          <button id="btn-dir" class="btn ghost" title="Choose a folder on disk (File System Access API)">Folder…</button>
          <button id="btn-theme" class="btn ghost" title="Toggle theme">☾</button>
        </div>
      </header>

      <main class="workspace">
        <section class="panel scene-panel">
          <div class="panel-head">
            <h2 id="scene-title">Scene</h2>
            <span id="plant-desc" class="badge muted"></span>
          </div>
          <div class="canvas-wrap">
            <canvas id="scene"></canvas>
          </div>
        </section>

        <section class="panel chart-panel">
          <div class="panel-head">
            <h2>Response</h2>
            <span id="chart-legend" class="muted small"></span>
          </div>
          <div id="chart" class="chart-host"></div>
        </section>

        <aside class="panel help-panel" id="help-panel">
          <div class="panel-head">
            <h2 id="help-title">Help</h2>
            <button id="btn-help-toggle" class="btn ghost small">hide</button>
          </div>
          <div id="help-body" class="markdown"></div>
        </aside>
      </main>

      <section class="bottom">
        <div class="panel editor-panel">
          <div class="panel-head">
            <div class="tabs" role="tablist">
              <button
                id="tab-controller"
                class="tab active"
                role="tab"
                aria-selected="true"
                aria-controls="pane-controller"
              >Controller</button>
              <button
                id="tab-debug"
                class="tab"
                role="tab"
                aria-selected="false"
                aria-controls="pane-debug"
              >Debug log<span id="debug-count" class="tab-count hidden">0</span></button>
            </div>
            <div class="controls">
              <button id="btn-run" class="btn primary">Run</button>
              <button id="btn-reset" class="btn">Reset</button>
              <button id="btn-stop" class="btn">Stop</button>
              <span id="status-badge" class="badge">idle</span>
            </div>
          </div>

          <div id="pane-controller" class="pane" role="tabpanel">
            <div id="editor" class="editor-host"></div>
            <div id="error-box" class="error-box hidden"></div>
            <div class="metrics">
              <div class="metric"><span>settle</span><strong id="m-settle">–</strong></div>
              <div class="metric"><span>overshoot</span><strong id="m-overshoot">–</strong></div>
              <div class="metric"><span>steady |e|</span><strong id="m-sse">–</strong></div>
              <div class="metric"><span>IAE</span><strong id="m-iae">–</strong></div>
              <div class="metric"><span>verdict</span><strong id="m-verdict">–</strong></div>
            </div>
          </div>

          <div id="pane-debug" class="pane hidden" role="tabpanel">
            <div class="debug-toolbar">
              <span class="muted small">
                Call <code>debug(value, …)</code> or <code>log(value, …)</code> inside your controller.
              </span>
              <span class="controls">
                <span id="debug-status" class="muted small"></span>
                <button id="btn-clear-log" class="btn ghost small">clear</button>
              </span>
            </div>
            <ol id="debug-log" class="debug-log"></ol>
          </div>
        </div>

        <div class="side-stack">
          <div class="panel math-panel">
            <div class="panel-head"><h2 id="math-title">Math &amp; variables</h2></div>
            <div id="math-help" class="math-help"></div>
          </div>
          <div class="panel notes-panel">
            <div class="panel-head">
              <h2>Notes</h2>
              <span id="notes-status" class="muted small"></span>
            </div>
            <textarea id="notes" placeholder="Your observations…"></textarea>
          </div>
        </div>
      </section>
    </div>

    <input id="file-input" type="file" accept="application/json,.json" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
